server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # 307 preserves WebDAV methods and request bodies without creating a
    # permanent browser redirect that can retain an old HTTPS port.
    add_header Cache-Control "no-store" always;
    return 307 https://$host:__HTTPS_REDIRECT_PORT__$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate /etc/nginx/certs/fileserver.crt;
    ssl_certificate_key /etc/nginx/certs/fileserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FileServerSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    charset utf-8;
    client_max_body_size 0;
    client_body_temp_path /tmp/nginx-client-body;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /_auth/check {
        internal;
        proxy_pass http://auth:8000/internal/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/admin-check {
        internal;
        proxy_pass http://auth:8000/internal/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    location = / {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /tmp;
        try_files /fileserver-index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /tmp;
        try_files /fileserver-index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /login {
        root /tmp/auth-ui;
        try_files /login.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /register {
        root /tmp/auth-ui;
        try_files /register.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /change-password {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /tmp/auth-ui;
        try_files /change-password.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        auth_request /_auth/admin-check;
        error_page 401 = @login_redirect;
        root /tmp/auth-ui;
        try_files /admin.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /auth-assets/auth.css {
        alias /tmp/auth-ui/auth.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://auth:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /file-actions.js {
        root /tmp;
        try_files /file-actions.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /settings.js {
        root /tmp;
        try_files /settings.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /connection-status.js {
        root /tmp;
        try_files /connection-status.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /breadcrumb.js {
        root /tmp;
        try_files /breadcrumb.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /sidebar-favorites.js {
        root /tmp;
        try_files /sidebar-favorites.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /ui-cleanup.js {
        root /tmp;
        try_files /ui-cleanup.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /responsive-location-bar.js {
        root /tmp;
        try_files /responsive-location-bar.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /auth-client.js {
        root /tmp;
        try_files /auth-client.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /files {
        auth_request /_auth/check;
        return 301 /files/;
    }

    # Always return an autoindex JSON listing for directories, even when the
    # mounted directory contains index.html or another conventional index file.
    location = /files/ {
        auth_request /_auth/check;
        root /;
        index __fileserver_autoindex_disabled__;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;

        limit_except GET HEAD MKCOL OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;
    }

    # The Trash directory may be listed and created, but the directory itself cannot be deleted.
    location = /files/Trash/ {
        auth_request /_auth/check;
        root /;
        index __fileserver_autoindex_disabled__;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;

        limit_except GET HEAD PUT MKCOL COPY MOVE OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;
    }

    location ~ ^/files/(?:\.nginx-client-body|\.nginx-client-temp)(?:/|$) {
        deny all;
    }

    location /files/ {
        auth_request /_auth/check;
        root /;
        index __fileserver_autoindex_disabled__;

        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;
        min_delete_depth 2;

        limit_except GET HEAD PUT DELETE MKCOL COPY MOVE OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;
    }
}
