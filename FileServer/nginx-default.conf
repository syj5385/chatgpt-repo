server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    add_header Cache-Control "no-store" always;
    return 307 https://$host:__HTTPS_REDIRECT_PORT__$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    absolute_redirect off;

    ssl_certificate /etc/nginx/certs/fileserver.crt;
    ssl_certificate_key /etc/nginx/certs/fileserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FileServerSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    charset utf-8;
    client_max_body_size 0;
    client_body_temp_path /tmp/nginx-client-body;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /_auth/check {
        internal;
        proxy_pass http://auth:8000/internal/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Content-Length $http_content_length;
        proxy_set_header X-Original-Destination $http_destination;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/admin-check {
        internal;
        proxy_pass http://auth:8000/internal/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    location = / {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /tmp;
        try_files /fileserver-index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /tmp;
        try_files /fileserver-index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /login {
        root /tmp/auth-ui;
        try_files /login.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /register {
        root /tmp/auth-ui;
        try_files /register.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /change-password {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /tmp/auth-ui;
        try_files /change-password.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /admin {
        auth_request /_auth/admin-check;
        error_page 401 = @login_redirect;
        root /tmp;
        try_files /fileserver-admin.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /auth-assets/auth.css {
        alias /tmp/auth-ui/auth.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    location = /auth-assets/admin-storage.js {
        alias /tmp/auth-ui/admin-storage.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /mobile-responsive.css {
        root /tmp;
        try_files /mobile-responsive.css =404;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    location = /toolbar-compact.css {
        root /tmp;
        try_files /toolbar-compact.css =404;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    location = /create-menu.css {
        root /tmp;
        try_files /create-menu.css =404;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    location = /explorer-fix.js {
        root /tmp;
        try_files /explorer-fix.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /explorer-v2.js {
        root /tmp;
        try_files /explorer-v2.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /explorer-extras.js {
        root /tmp;
        try_files /explorer-extras.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /toolbar-context.js {
        root /tmp;
        try_files /toolbar-context.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /create-menu.js {
        root /tmp;
        try_files /create-menu.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /mobile-toolbar-fix.js {
        root /tmp;
        try_files /mobile-toolbar-fix.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /auth-client.js {
        root /tmp;
        try_files /auth-client.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        auth_request /_auth/check;
        error_page 401 = @login_redirect;
        root /;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }
}
