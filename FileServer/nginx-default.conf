server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    charset utf-8;
    client_max_body_size 0;
    client_body_temp_path /tmp/nginx-client-body;

    location = / {
        root /tmp;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        root /tmp;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /files {
        return 301 /files/;
    }

    # Protect the file-store root itself from DELETE while still exposing its listing.
    location = /files/ {
        root /;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;

        limit_except GET HEAD MKCOL OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;
    }

    # The Trash directory may be listed and created, but the directory itself cannot be deleted.
    location = /files/Trash/ {
        root /;
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;

        limit_except GET HEAD PUT MKCOL COPY MOVE OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;
    }

    location ~ ^/files/(?:\.nginx-client-body|\.nginx-client-temp)(?:/|$) {
        deny all;
    }

    location /files/ {
        root /;

        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        create_full_put_path on;
        dav_access user:rw group:rw all:rw;
        min_delete_depth 2;

        limit_except GET HEAD PUT DELETE MKCOL COPY MOVE OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;
    }
}
