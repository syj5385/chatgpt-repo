services:
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: fileserver-auth:latest
    container_name: FileServerAuth
    environment:
      FILESERVER_ACCESS_MODE: "${FILESERVER_ACCESS_MODE:-private}"
      FILESERVER_ADMIN_USER: "${FILESERVER_ADMIN_USER:-admin}"
      FILESERVER_ADMIN_PASSWORD: "${FILESERVER_ADMIN_PASSWORD:-admin}"
      FILESERVER_COOKIE_SECURE: "${FILESERVER_COOKIE_SECURE:-true}"
      FILESERVER_SESSION_HOURS: "${FILESERVER_SESSION_HOURS:-12}"
      FILESERVER_REMEMBER_DAYS: "${FILESERVER_REMEMBER_DAYS:-30}"
      FILESERVER_PASSWORD_MIN_LENGTH: "${FILESERVER_PASSWORD_MIN_LENGTH:-8}"
      FILESERVER_AUTH_DB: /data/auth.db
    volumes:
      - ./auth-data:/data
    restart: unless-stopped

  fileserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileserver:latest
    container_name: FileServer
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "${FILESERVER_PORT:-18080}:80"
      - "${FILESERVER_HTTPS_PORT:-18443}:443"
    environment:
      FILESERVER_CERT_CN: "${FILESERVER_CERT_CN:-localhost}"
      FILESERVER_CERT_SAN: "${FILESERVER_CERT_SAN:-DNS:localhost,IP:127.0.0.1}"
      FILESERVER_CERT_DAYS: "${FILESERVER_CERT_DAYS:-825}"
      FILESERVER_HTTPS_REDIRECT_PORT: "${FILESERVER_HTTPS_PORT:-18443}"
    volumes:
      - ./index.html:/tmp/index.html:ro
      - ./file-actions.js:/tmp/file-actions.js:ro
      - ./settings.js:/tmp/settings.js:ro
      - ./connection-status.js:/tmp/connection-status.js:ro
      - ./breadcrumb.js:/tmp/breadcrumb.js:ro
      - ./sidebar-favorites.js:/tmp/sidebar-favorites.js:ro
      - ./ui-cleanup.js:/tmp/ui-cleanup.js:ro
      - ./responsive-location-bar.js:/tmp/responsive-location-bar.js:ro
      - ./auth-client.js:/tmp/auth-client.js:ro
      - ./auth-ui:/tmp/auth-ui:ro
      - ./nginx-default.conf:/etc/nginx/sites-available/default:ro
      - ./files:/files
      - ./certs:/etc/nginx/certs
    command:
      - /bin/bash
      - -c
      - |
        set -e
        mkdir -p /files/Trash /tmp/nginx-client-body /etc/nginx/certs

        case "$${FILESERVER_HTTPS_REDIRECT_PORT}" in
          ''|*[!0-9]*)
            echo "FILESERVER_HTTPS_PORT must be a numeric TCP port" >&2
            exit 1
            ;;
        esac

        if [ "$${FILESERVER_HTTPS_REDIRECT_PORT}" -lt 1 ] || [ "$${FILESERVER_HTTPS_REDIRECT_PORT}" -gt 65535 ]; then
          echo "FILESERVER_HTTPS_PORT must be between 1 and 65535" >&2
          exit 1
        fi

        if [ ! -s /etc/nginx/certs/fileserver.crt ] || [ ! -s /etc/nginx/certs/fileserver.key ]; then
          echo "Generating a self-signed TLS certificate for $${FILESERVER_CERT_CN}"
          umask 077
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 \
            -days "$${FILESERVER_CERT_DAYS}" \
            -keyout /etc/nginx/certs/fileserver.key \
            -out /etc/nginx/certs/fileserver.crt \
            -subj "/CN=$${FILESERVER_CERT_CN}" \
            -addext "subjectAltName=$${FILESERVER_CERT_SAN}"
        fi

        chmod 600 /etc/nginx/certs/fileserver.key
        chmod 644 /etc/nginx/certs/fileserver.crt

        sed 's#</body>#<script src="/file-actions.js"></script><script src="/settings.js"></script><script src="/connection-status.js"></script><script src="/breadcrumb.js"></script><script src="/sidebar-favorites.js"></script><script src="/ui-cleanup.js"></script><script src="/responsive-location-bar.js"></script><script src="/auth-client.js"></script></body>#' \
          /tmp/index.html \
          > /tmp/fileserver-index.html

        rm -f /etc/nginx/sites-enabled/default
        sed "s/__HTTPS_REDIRECT_PORT__/$${FILESERVER_HTTPS_REDIRECT_PORT}/g" \
          /etc/nginx/sites-available/default \
          > /etc/nginx/sites-enabled/default
        nginx -t
        exec nginx -g 'daemon off;'
    restart: unless-stopped
