services:
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: fileserver-auth:latest
    container_name: FileServerAuth
    environment:
      FILESERVER_ACCESS_MODE: "${FILESERVER_ACCESS_MODE:-private}"
      FILESERVER_ADMIN_USER: "${FILESERVER_ADMIN_USER:-admin}"
      FILESERVER_ADMIN_PASSWORD: "${FILESERVER_ADMIN_PASSWORD:-admin}"
      FILESERVER_COOKIE_SECURE: "${FILESERVER_COOKIE_SECURE:-true}"
      FILESERVER_SESSION_HOURS: "${FILESERVER_SESSION_HOURS:-12}"
      FILESERVER_REMEMBER_DAYS: "${FILESERVER_REMEMBER_DAYS:-30}"
      FILESERVER_PASSWORD_MIN_LENGTH: "${FILESERVER_PASSWORD_MIN_LENGTH:-8}"
      FILESERVER_AUTH_DB: /data/auth.db
      FILESERVER_FILES_ROOT: /files
      FILESERVER_DEFAULT_QUOTA_BYTES: "${FILESERVER_DEFAULT_QUOTA_BYTES:-53687091200}"
      FILESERVER_UPLOAD_CHUNK_BYTES: "${FILESERVER_UPLOAD_CHUNK_BYTES:-8388608}"
      FILESERVER_PUBLIC_UPLOAD_MAX_BYTES: "${FILESERVER_PUBLIC_UPLOAD_MAX_BYTES:-2147483648}"
      FILESERVER_VERSION_LIMIT: "${FILESERVER_VERSION_LIMIT:-20}"
      FILESERVER_SHARE_MAX_DAYS: "${FILESERVER_SHARE_MAX_DAYS:-90}"
    volumes:
      - ./auth-data:/data
      - ./files:/files
    restart: unless-stopped

  fileserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileserver:latest
    container_name: FileServer
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "${FILESERVER_PORT:-5080}:80"
      - "${FILESERVER_HTTPS_PORT:-5443}:443"
    environment:
      FILESERVER_CERT_CN: "${FILESERVER_CERT_CN:-localhost}"
      FILESERVER_CERT_SAN: "${FILESERVER_CERT_SAN:-DNS:localhost,IP:127.0.0.1}"
      FILESERVER_CERT_DAYS: "${FILESERVER_CERT_DAYS:-825}"
      FILESERVER_HTTPS_REDIRECT_PORT: "${FILESERVER_HTTPS_PORT:-5443}"
    volumes:
      - ./index.html:/tmp/index.html:ro
      - ./mobile-responsive.css:/tmp/mobile-responsive-source.css:ro
      - ./navigation-enhancements.css:/tmp/navigation-enhancements.css:ro
      - ./exclusive-view.css:/tmp/exclusive-view.css:ro
      - ./mobile-toolbar-fix.css:/tmp/mobile-toolbar-fix.css:ro
      - ./toolbar-compact.css:/tmp/toolbar-compact.css:ro
      - ./create-menu.css:/tmp/create-menu-source.css:ro
      - ./icon-theme.css:/tmp/icon-theme.css:ro
      - ./explorer-fix.js:/tmp/explorer-fix.js:ro
      - ./explorer-v2.js:/tmp/explorer-v2.js:ro
      - ./explorer-extras.js:/tmp/explorer-extras.js:ro
      - ./toolbar-context.js:/tmp/toolbar-context-source.js:ro
      - ./create-menu.js:/tmp/create-menu-source.js:ro
      - ./icon-theme.js:/tmp/icon-theme.js:ro
      - ./view-mode-fix.js:/tmp/view-mode-fix.js:ro
      - ./navigation-enhancements.js:/tmp/navigation-enhancements.js:ro
      - ./exclusive-view.js:/tmp/exclusive-view.js:ro
      - ./view-display-hardfix.js:/tmp/view-display-hardfix.js:ro
      - ./mobile-toolbar-fix.js:/tmp/mobile-toolbar-fix.js:ro
      - ./auth-client.js:/tmp/auth-client.js:ro
      - ./auth-ui:/tmp/auth-ui:ro
      - ./nginx-default.conf:/etc/nginx/sites-available/default:ro
      - ./files:/files
      - ./certs:/etc/nginx/certs
    command:
      - /bin/bash
      - -c
      - |
        set -e
        mkdir -p /files/Trash /files/users /files/shared /tmp/nginx-client-body /etc/nginx/certs

        case "$${FILESERVER_HTTPS_REDIRECT_PORT}" in
          ''|*[!0-9]*)
            echo "FILESERVER_HTTPS_PORT must be a numeric TCP port" >&2
            exit 1
            ;;
        esac

        if [ "$${FILESERVER_HTTPS_REDIRECT_PORT}" -lt 1 ] || [ "$${FILESERVER_HTTPS_REDIRECT_PORT}" -gt 65535 ]; then
          echo "FILESERVER_HTTPS_PORT must be between 1 and 65535" >&2
          exit 1
        fi

        if [ ! -s /etc/nginx/certs/fileserver.crt ] || [ ! -s /etc/nginx/certs/fileserver.key ]; then
          echo "Generating a self-signed TLS certificate for $${FILESERVER_CERT_CN}"
          umask 077
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 \
            -days "$${FILESERVER_CERT_DAYS}" \
            -keyout /etc/nginx/certs/fileserver.key \
            -out /etc/nginx/certs/fileserver.crt \
            -subj "/CN=$${FILESERVER_CERT_CN}" \
            -addext "subjectAltName=$${FILESERVER_CERT_SAN}"
        fi

        chmod 600 /etc/nginx/certs/fileserver.key
        chmod 644 /etc/nginx/certs/fileserver.crt

        # Keep mobile toolbar assets outside the large compatibility bundle.
        # This prevents an unrelated UI script error from suppressing the
        # three primary mobile actions.
        cat /tmp/mobile-responsive-source.css /tmp/icon-theme.css /tmp/navigation-enhancements.css /tmp/exclusive-view.css > /tmp/mobile-responsive.css
        cat /tmp/create-menu-source.css /tmp/mobile-toolbar-fix.css > /tmp/create-menu.css
        cat /tmp/mobile-toolbar-fix.js /tmp/toolbar-context-source.js > /tmp/toolbar-context.js
        cat /tmp/create-menu-source.js /tmp/icon-theme.js /tmp/view-mode-fix.js /tmp/navigation-enhancements.js /tmp/exclusive-view.js /tmp/view-display-hardfix.js > /tmp/create-menu.js

        sed 's#</head>#<link rel="stylesheet" href="/mobile-responsive.css"><link rel="stylesheet" href="/toolbar-compact.css"><link rel="stylesheet" href="/create-menu.css"></head>#; s#<script src="/explorer-v2.js"></script>#<script src="/explorer-fix.js"></script><script src="/explorer-v2.js"></script>#; s#</body>#<script src="/explorer-extras.js"></script><script src="/toolbar-context.js"></script><script src="/create-menu.js"></script></body>#' /tmp/index.html > /tmp/fileserver-index.html
        sed 's#</body>#<script src="/auth-assets/admin-storage.js"></script></body>#' /tmp/auth-ui/admin.html > /tmp/fileserver-admin.html

        rm -f /etc/nginx/sites-enabled/default
        sed "s/__HTTPS_REDIRECT_PORT__/$${FILESERVER_HTTPS_REDIRECT_PORT}/g" \
          /etc/nginx/sites-available/default \
          > /etc/nginx/sites-enabled/default
        nginx -t
        exec nginx -g 'daemon off;'
    restart: unless-stopped
