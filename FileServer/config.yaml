services:
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: fileserver-auth:latest
    container_name: FileServerAuth
    environment:
      FILESERVER_ACCESS_MODE: "${FILESERVER_ACCESS_MODE:-private}"
      FILESERVER_ADMIN_USER: "${FILESERVER_ADMIN_USER:-admin}"
      FILESERVER_ADMIN_PASSWORD: "${FILESERVER_ADMIN_PASSWORD:-admin}"
      FILESERVER_COOKIE_SECURE: "${FILESERVER_COOKIE_SECURE:-true}"
      FILESERVER_SESSION_HOURS: "${FILESERVER_SESSION_HOURS:-12}"
      FILESERVER_REMEMBER_DAYS: "${FILESERVER_REMEMBER_DAYS:-30}"
      FILESERVER_PASSWORD_MIN_LENGTH: "${FILESERVER_PASSWORD_MIN_LENGTH:-8}"
      FILESERVER_AUTH_DB: /data/auth.db
      FILESERVER_FILES_ROOT: /files
      FILESERVER_DEFAULT_QUOTA_BYTES: "${FILESERVER_DEFAULT_QUOTA_BYTES:-53687091200}"
      FILESERVER_UPLOAD_CHUNK_BYTES: "${FILESERVER_UPLOAD_CHUNK_BYTES:-8388608}"
      FILESERVER_PUBLIC_UPLOAD_MAX_BYTES: "${FILESERVER_PUBLIC_UPLOAD_MAX_BYTES:-2147483648}"
      FILESERVER_VERSION_LIMIT: "${FILESERVER_VERSION_LIMIT:-20}"
      FILESERVER_SHARE_MAX_DAYS: "${FILESERVER_SHARE_MAX_DAYS:-90}"
    volumes:
      - ./auth-data:/data
      - ./files:/files
    restart: unless-stopped

  fileserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileserver:latest
    container_name: FileServer
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "${FILESERVER_PORT:-5080}:80"
      - "${FILESERVER_HTTPS_PORT:-5443}:443"
    environment:
      FILESERVER_CERT_CN: "${FILESERVER_CERT_CN:-localhost}"
      FILESERVER_CERT_SAN: "${FILESERVER_CERT_SAN:-DNS:localhost,IP:127.0.0.1}"
      FILESERVER_CERT_DAYS: "${FILESERVER_CERT_DAYS:-825}"
      FILESERVER_HTTPS_REDIRECT_PORT: "${FILESERVER_HTTPS_PORT:-5443}"
    volumes:
      - ./index.html:/tmp/index.html:ro
      - ./mobile-responsive.css:/tmp/mobile-responsive-source.css:ro
      - ./navigation-enhancements.css:/tmp/navigation-enhancements.css:ro
      - ./exclusive-view.css:/tmp/exclusive-view.css:ro
      - ./mobile-toolbar-fix.css:/tmp/mobile-toolbar-fix.css:ro
      - ./toolbar-compact.css:/tmp/toolbar-compact.css:ro
      - ./create-menu.css:/tmp/create-menu-source.css:ro
      - ./icon-theme.css:/tmp/icon-theme.css:ro
      - ./explorer-v2.js:/tmp/explorer-v2-source.js:ro
      - ./explorer-extras.js:/tmp/explorer-extras.js:ro
      - ./toolbar-context.js:/tmp/toolbar-context-source.js:ro
      - ./mobile-toolbar-fix.js:/tmp/mobile-toolbar-fix.js:ro
      - ./auth-client.js:/tmp/auth-client.js:ro
      - ./auth-ui:/tmp/auth-ui:ro
      - ./bootstrap-clean.sh:/tmp/bootstrap-clean.sh:ro
      - ./nginx-default.conf:/etc/nginx/sites-available/default:ro
      - ./files:/files
      - ./certs:/etc/nginx/certs
    command: ["/bin/bash", "/tmp/bootstrap-clean.sh"]
    restart: unless-stopped
