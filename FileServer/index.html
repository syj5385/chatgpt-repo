<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<title>FileServer</title>
<style>
:root{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color-scheme:light;--bg:#f3f3f3;--surface:#fff;--soft:#f8f8f8;--hover:#edf4fb;--selected:#dceeff;--text:#202020;--muted:#666;--line:#dedede;--strong:#aaa;--accent:#0067c0;--danger:#c42b1c;--success:#16803c;--shadow:#0003}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:42px 49px 50px minmax(0,1fr) 29px}.bar{display:flex;align-items:center;gap:6px;padding:0 11px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line)}.title{font-size:13px;font-weight:700}.grow{flex:1}.cmd,.nav,.icon-button{height:34px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text);cursor:pointer;padding:0 10px}.cmd:hover,.nav:hover,.icon-button:hover,.side button:hover{background:var(--hover)}.cmd:disabled,.nav:disabled{opacity:.35;cursor:default}.nav{width:34px;padding:0;font-size:18px}.separator{width:1px;height:24px;background:var(--line);margin:0 3px}.box{height:36px;border:1px solid var(--strong);border-radius:8px;background:var(--surface);display:flex;align-items:center;padding:0 10px}.address{flex:1;min-width:120px}.search{width:min(360px,34vw)}.box input{border:0;outline:0;background:transparent;color:var(--text);width:100%;height:100%;padding-left:8px}.work{min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr)}.side{min-height:0;padding:10px 8px;border-right:1px solid var(--line);background:var(--soft);overflow:auto}.side small{display:block;padding:8px 12px 5px;color:var(--muted);font-weight:700}.side button{width:100%;height:36px;border:0;border-radius:7px;background:transparent;color:var(--text);text-align:left;padding:0 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side button.active{background:var(--selected)}.quota{margin:16px 10px 4px;font-size:11px;color:var(--muted)}.quota-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:7px 0}.quota-fill{height:100%;width:0;background:var(--accent)}.main{min-width:0;min-height:0;background:var(--surface);display:flex;flex-direction:column;position:relative}.filters{min-height:42px;display:flex;align-items:center;gap:7px;padding:5px 10px;border-bottom:1px solid var(--line);overflow:auto}.chip{height:30px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);padding:0 11px;cursor:pointer;white-space:nowrap}.chip.active{background:var(--selected);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}.content{flex:1;min-height:0;overflow:auto;position:relative}.list-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}.list-table thead{position:sticky;top:0;z-index:3;background:var(--surface)}.list-table th{height:35px;padding:0 10px;text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer}.list-table td{height:40px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-row:hover{background:var(--hover)}.item-row.selected{background:var(--selected);outline:1px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:-1px}.name-cell{display:flex;align-items:center;gap:9px}.file-icon{width:22px;text-align:center;font-size:17px}.c-name{width:49%}.c-date{width:24%}.c-type{width:17%}.c-size{width:10%;text-align:right}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}.tile{min-width:0;height:154px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;cursor:pointer}.tile:hover{background:var(--hover)}.tile.selected{background:var(--selected);outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}.thumb{height:110px;display:grid;place-items:center;background:var(--soft);font-size:44px;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.tile-name{padding:9px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--muted);pointer-events:none}.state.show{display:grid}.status{font-size:12px;color:var(--muted);border-top:1px solid var(--line);border-bottom:0}.drawer{position:absolute;right:0;top:0;bottom:0;width:min(390px,92vw);z-index:20;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px var(--shadow);display:none;flex-direction:column}.drawer.show{display:flex}.drawer-head{height:52px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);gap:8px}.drawer-body{flex:1;overflow:auto;padding:15px}.drawer-section{border-bottom:1px solid var(--line);padding:0 0 15px;margin-bottom:15px}.drawer-section h3{font-size:13px;margin:0 0 10px}.kv{display:grid;grid-template-columns:105px 1fr;gap:8px;font-size:12px}.kv b{color:var(--muted);font-weight:500}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{padding:4px 8px;border-radius:999px;background:var(--selected);font-size:11px}.activity-item,.comment-item,.version-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.muted{color:var(--muted);font-size:11px}.menu{display:none;position:fixed;z-index:90;min-width:220px;padding:6px;background:var(--surface);border:1px solid var(--strong);border-radius:9px;box-shadow:0 12px 30px var(--shadow)}.menu.show{display:block}.menu button{width:100%;height:34px;border:0;border-radius:6px;background:transparent;color:var(--text);text-align:left;padding:0 10px;cursor:pointer}.menu button:hover{background:var(--hover)}.menu button.danger{color:var(--danger)}.menu hr{border:0;border-top:1px solid var(--line);margin:5px}.shade{display:none;position:fixed;inset:0;z-index:100;background:#0005;align-items:center;justify-content:center;padding:16px}.shade.show{display:flex}.modal{width:min(590px,100%);max-height:88vh;background:var(--surface);border-radius:12px;box-shadow:0 18px 50px #0005;display:flex;flex-direction:column;overflow:hidden}.modal.wide{width:min(980px,100%);height:min(780px,88vh)}.modal-head,.modal-foot{min-height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);gap:8px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.modal-body{padding:18px;overflow:auto}.modal.wide .modal-body{flex:1;min-height:0}.btn{height:34px;min-width:80px;border:1px solid var(--strong);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;padding:0 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.input,.select,.textarea{width:100%;border:1px solid var(--strong);border-radius:7px;background:var(--surface);color:var(--text);outline:0}.input,.select{height:38px;padding:0 10px}.textarea{min-height:110px;padding:10px;resize:vertical}.form-row{display:grid;gap:6px;margin-bottom:13px}.form-row label{font-size:12px;font-weight:600}.preview{width:100%;height:100%;display:grid;place-items:center;background:#111;overflow:auto}.preview img,.preview video{max-width:100%;max-height:100%}.preview iframe{width:100%;height:100%;border:0;background:#fff}.preview textarea{width:100%;height:100%;resize:none;border:0;padding:16px;background:var(--surface);color:var(--text);font:13px/1.5 ui-monospace,monospace}.toast{position:fixed;right:16px;bottom:42px;z-index:130;display:grid;gap:8px}.toast div{max-width:440px;padding:11px 14px;background:var(--surface);border:1px solid var(--strong);border-radius:8px;box-shadow:0 8px 24px var(--shadow);font-size:13px}.upload-panel{position:fixed;right:16px;bottom:42px;z-index:80;width:min(410px,calc(100vw - 32px));max-height:55vh;background:var(--surface);border:1px solid var(--strong);border-radius:11px;box-shadow:0 12px 34px var(--shadow);display:none;flex-direction:column;overflow:hidden}.upload-panel.show{display:flex}.upload-head{height:43px;padding:0 12px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.upload-list{overflow:auto}.upload-item{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}.progress{height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin:7px 0}.progress>span{display:block;height:100%;background:var(--accent);width:0}.upload-actions{display:flex;gap:6px}.upload-actions button{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--text);cursor:pointer}.drop-overlay{display:none;position:fixed;inset:10px;z-index:120;place-items:center;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--selected) 92%,transparent);color:var(--accent);font-size:20px;font-weight:700}.drop-overlay.show{display:grid}.activity-view{padding:12px}.activity-card{padding:12px;border-bottom:1px solid var(--line);font-size:13px}.top-actions{display:flex;gap:3px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171717;--surface:#222;--soft:#292929;--hover:#303842;--selected:#173b58;--text:#f2f2f2;--muted:#b8b8b8;--line:#3c3c3c;--strong:#5b5b5b;--accent:#56aaf8;--shadow:#0008}}:root[data-theme="dark"]{color-scheme:dark;--bg:#171717;--surface:#222;--soft:#292929;--hover:#303842;--selected:#173b58;--text:#f2f2f2;--muted:#b8b8b8;--line:#3c3c3c;--strong:#5b5b5b;--accent:#56aaf8;--shadow:#0008}@media(max-width:780px){.app{grid-template-rows:42px 49px 92px minmax(0,1fr) 29px}.work{grid-template-columns:1fr}.side{display:none}.location-bar{display:grid;grid-template-columns:34px 34px 34px minmax(0,1fr);grid-template-rows:36px 36px;align-content:center;gap:6px;padding:7px 8px}.location-bar .address{grid-column:4;grid-row:1}.location-bar .search{grid-column:1/-1;grid-row:2;width:100%}.cmd span{display:none}.cmd{width:36px;padding:0}.c-type,.list-table th:nth-child(3),.list-table td:nth-child(3){display:none}.drawer{width:100%}.filters{min-height:40px}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));padding:9px;gap:8px}.tile{height:135px}.thumb{height:94px}}
</style>
<style>.thumb img,.thumb video,.thumb iframe{width:100%;height:100%;border:0;object-fit:cover}.thumb.has-thumbnail{font-size:0}.thumb.pdf-thumbnail{background:#e5e5e5}.thumb.pdf-thumbnail iframe{pointer-events:none;background:#fff}</style>
<style>.modal-foot{height:auto;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}</style>
<style>.markdown-document{max-width:860px;margin:0 auto;padding:8px 12px 40px;line-height:1.65;overflow-wrap:anywhere}.markdown-document h1,.markdown-document h2{border-bottom:1px solid var(--line);padding-bottom:.3em}.markdown-document h1{font-size:2em}.markdown-document h2{font-size:1.5em}.markdown-document h3{font-size:1.25em}.markdown-document pre{overflow:auto;padding:14px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}.markdown-document code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:.15em .35em;border-radius:4px}.markdown-document pre code{padding:0;background:transparent}.markdown-document blockquote{margin-left:0;padding:4px 16px;border-left:4px solid var(--strong);color:var(--muted)}.markdown-document table{width:100%;border-collapse:collapse;display:block;overflow:auto}.markdown-document th,.markdown-document td{border:1px solid var(--line);padding:7px 10px;text-align:left}.markdown-document a{color:var(--accent)}</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar"><span>📁</span><span class="title">FileServer</span><span class="grow"></span><span id="conn">Ready</span></div>
  <div class="bar toolbar">
    <button class="cmd" id="newFolder" title="새 폴더">＋ <span>새 폴더</span></button>
    <button class="cmd" id="newFile" title="새 파일">📄 <span>새 파일</span></button>
    <button class="cmd" id="uploadFiles" title="파일 업로드">⤴ <span>업로드</span></button>
    <button class="cmd" id="uploadFolder" title="폴더 업로드">📂 <span>폴더 업로드</span></button>
    <span class="separator"></span>
    <button class="cmd" id="download" disabled>⤵ <span>다운로드</span></button>
    <button class="cmd" id="move" disabled>↪ <span>이동</span></button>
    <button class="cmd" id="copy" disabled>⧉ <span>복사</span></button>
    <button class="cmd" id="archive" disabled>🗜 <span>압축</span></button>
    <button class="cmd" id="remove" disabled>🗑 <span>삭제</span></button>
    <button class="cmd" id="details" disabled>ⓘ <span>정보</span></button>
    <span class="grow"></span>
    <button class="cmd" id="viewToggle" title="보기 방식">▦ <span>보기</span></button>
    <button class="cmd" id="refresh">↻ <span>새로고침</span></button>
    <input id="filePicker" type="file" multiple hidden>
    <input id="folderPicker" type="file" webkitdirectory multiple hidden>
  </div>
  <div class="bar location-bar"><button class="nav" id="back" disabled>‹</button><button class="nav" id="forward" disabled>›</button><button class="nav" id="up">↑</button><div class="box address">📁<input id="address" value="Home" spellcheck="false"></div><div class="box search">⌕<input id="search" placeholder="파일 검색" spellcheck="false"></div></div>
  <div class="work">
    <aside class="side">
      <small>파일</small>
      <button data-view="home" class="active">⌂ &nbsp; 내 파일</button>
      <button data-view="shared">👥 &nbsp; 공용 폴더</button>
      <button data-view="recent">🕘 &nbsp; 최근 사용</button>
      <button data-view="favorites">★ &nbsp; 즐겨찾기</button>
      <button data-view="activity">☷ &nbsp; 활동 기록</button>
      <button data-view="trash">🗑 &nbsp; 휴지통</button>
      <small>도구</small>
      <button id="sharesButton">🔗 &nbsp; 공유 링크 관리</button>
      <button id="themeButton">◐ &nbsp; 테마 변경</button>
      <div class="quota"><span id="quotaText">저장 공간 계산 중</span><div class="quota-track"><div class="quota-fill" id="quotaFill"></div></div></div>
    </aside>
    <main class="main">
      <div class="filters" id="filters">
        <button class="chip active" data-kind="all">전체</button><button class="chip" data-kind="folder">폴더</button><button class="chip" data-kind="image">이미지</button><button class="chip" data-kind="video">영상</button><button class="chip" data-kind="document">문서</button><button class="chip" data-kind="archive">압축</button>
        <span class="grow"></span><select class="select" id="sizeFilter" style="width:145px;height:30px"><option value="0">모든 크기</option><option value="104857600">100MB 이상</option><option value="1073741824">1GB 이상</option><option value="10737418240">10GB 이상</option></select>
      </div>
      <div class="content" id="content" tabindex="0">
        <table class="list-table" id="table"><thead><tr><th class="c-name" data-sort="name">이름 <i></i></th><th class="c-date" data-sort="mtime">수정한 날짜 <i></i></th><th class="c-type" data-sort="type">유형 <i></i></th><th class="c-size" data-sort="size">크기 <i></i></th></tr></thead><tbody id="body"></tbody></table>
        <div class="grid" id="grid" hidden></div>
        <div class="activity-view" id="activityView" hidden></div>
        <div class="state" id="empty">📂<br>표시할 파일이 없습니다.</div><div class="state" id="loading">불러오는 중…</div>
      </div>
      <aside class="drawer" id="drawer"><div class="drawer-head"><b id="drawerTitle">파일 정보</b><span class="grow"></span><button class="icon-button" id="closeDrawer">✕</button></div><div class="drawer-body" id="drawerBody"></div></aside>
    </main>
  </div>
  <div class="bar status"><span id="count">0개 항목</span><span id="chosen"></span><span class="grow"></span><span id="pathStatus"></span></div>
</div>
<div class="menu" id="menu"></div><div class="shade" id="shade"></div><div class="toast" id="toasts"></div><div class="upload-panel" id="uploadPanel"><div class="upload-head"><b>업로드</b><span class="grow"></span><button class="icon-button" id="closeUploads">×</button></div><div class="upload-list" id="uploadList"></div></div><div class="drop-overlay" id="dropOverlay">파일 또는 폴더를 놓아 업로드</div>
<script src="/explorer-v2.js"></script>
<script src="/auth-client.js"></script>
</body>
</html>
