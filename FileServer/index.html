<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileServer</title>
<style>
:root{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#202020;background:#f3f3f3;--blue:#0067c0;--line:#e5e5e5;--sel:#e7f2ff;--hover:#f3f7fb;--danger:#c42b1c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:42px 49px 50px 1fr 29px}.bar{display:flex;align-items:center;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);padding:0 11px;gap:6px}.title{font-size:13px;font-weight:600}.grow{flex:1}.cmd,.nav{height:34px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;padding:0 10px}.cmd:hover,.nav:hover,.side button:hover{background:#ededed}.cmd:disabled,.nav:disabled{opacity:.35;cursor:default}.nav{width:34px;padding:0;font-size:18px}.box{height:36px;border:1px solid #d2d2d2;border-radius:7px;background:#fff;display:flex;align-items:center;padding:0 10px}.address{flex:1}.search{width:min(330px,32vw)}.box input{border:0;outline:0;background:transparent;width:100%;height:100%;padding-left:8px}.work{min-height:0;display:grid;grid-template-columns:220px 1fr}.side{padding:10px 8px;border-right:1px solid var(--line);background:#fafafa}.side small{display:block;padding:7px 12px;color:#666;font-weight:600}.side button{width:100%;height:36px;border:0;border-radius:6px;background:transparent;text-align:left;padding:0 12px;cursor:pointer}.side button.active{background:#e8e8e8}.main{min-width:0;min-height:0;background:#fff}.list{height:100%;overflow:auto;position:relative;outline:0}table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}thead{position:sticky;top:0;z-index:3;background:#fff}th{height:34px;padding:0 10px;text-align:left;font-weight:400;color:#666;border-bottom:1px solid var(--line);cursor:pointer}th+th{border-left:1px solid #f0f0f0}td{height:38px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tr.item:hover{background:var(--hover)}tr.item.selected{background:var(--sel);outline:1px solid #9ec9f1;outline-offset:-1px}.name{display:flex;align-items:center;gap:8px}.ico{width:20px;text-align:center}.c-name{width:49%}.c-date{width:23%}.c-type{width:17%}.c-size{width:11%;text-align:right}.state{position:absolute;inset:35px 0 0;display:none;place-items:center;color:#666}.state.show{display:grid}.status{font-size:12px;color:#666;border-top:1px solid var(--line);border-bottom:0}.menu{display:none;position:fixed;z-index:50;min-width:205px;padding:5px;background:rgba(255,255,255,.98);border:1px solid #ccc;border-radius:8px;box-shadow:0 10px 28px #0003}.menu.show{display:block}.menu button{display:block;width:100%;height:34px;border:0;border-radius:5px;background:transparent;text-align:left;padding:0 10px;cursor:pointer}.menu button:hover{background:#eee}.menu button.danger{color:var(--danger)}.menu hr{border:0;border-top:1px solid var(--line);margin:5px}.shade{display:none;position:fixed;inset:0;z-index:60;background:#0005;align-items:center;justify-content:center;padding:18px}.shade.show{display:flex}.modal{width:min(520px,100%);max-height:86vh;background:#fff;border-radius:10px;box-shadow:0 12px 34px #0004;display:flex;flex-direction:column;overflow:hidden}.modal.editor{width:min(900px,100%);height:min(760px,80vh)}.mh,.mf{min-height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);gap:8px}.mf{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.mb{padding:18px;overflow:auto}.editor .mb{padding:0;display:flex;flex:1;min-height:0}.close{margin-left:auto;border:0;background:transparent;border-radius:5px;width:32px;height:32px;cursor:pointer}.btn{height:34px;min-width:82px;border:1px solid #aaa;border-radius:6px;background:#fff;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.input{width:100%;height:36px;border:1px solid #bbb;border-radius:6px;padding:0 10px;outline:0}.props{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:13px}.props b{color:#666;font-weight:400}.editwrap{display:flex;flex:1;min-height:0;flex-direction:column}.editinfo{height:34px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:#666}.editor textarea{flex:1;min-height:0;border:0;outline:0;resize:none;padding:15px;font:13px/1.55 ui-monospace,monospace;tab-size:2}.toast{position:fixed;right:18px;bottom:45px;z-index:80;display:grid;gap:8px}.toast div{max-width:430px;padding:12px 14px;background:#fff;border:1px solid #bbb;border-radius:8px;box-shadow:0 8px 24px #0003;font-size:13px}.drop{display:none;position:fixed;inset:10px;z-index:70;place-items:center;border:2px dashed var(--blue);border-radius:14px;background:#e9f4ffdd;color:var(--blue);font-size:20px;font-weight:600}.drop.show{display:grid}@media(max-width:720px){.work{grid-template-columns:1fr}.side{display:none}.cmd span{display:none}.cmd{width:36px;padding:0}.c-type,th:nth-child(3),td:nth-child(3){display:none}.search{width:38%;min-width:125px}}
</style>
</head>
<body>
<div class="app">
 <div class="bar"><span>📁</span><span class="title">FileServer</span><span class="grow"></span><span id="conn">Ready</span></div>
 <div class="bar">
  <button class="cmd" id="newDir">📁 <span>New folder</span></button><button class="cmd" id="newFile">📄 <span>New file</span></button><button class="cmd" id="upload">⤴ <span>Upload</span></button>
  <span style="width:1px;height:24px;background:#ddd;margin:0 4px"></span><button class="cmd" id="download" disabled>⤵ <span>Download</span></button><button class="cmd" id="remove" disabled>🗑 <span>Delete</span></button><button class="cmd" id="properties" disabled>ⓘ <span>Properties</span></button><span class="grow"></span><button class="cmd" id="refresh">↻ <span>Refresh</span></button><input id="picker" type="file" multiple hidden>
 </div>
 <div class="bar"><button class="nav" id="back" disabled>‹</button><button class="nav" id="forward" disabled>›</button><button class="nav" id="up">↑</button><div class="box address">📁<input id="address" value="Home" spellcheck="false"></div><div class="box search">⌕<input id="search" placeholder="Search Home" spellcheck="false"></div></div>
 <div class="work"><aside class="side"><small>Quick access</small><button id="home" class="active">⌂ &nbsp; Home</button><button id="trash">🗑 &nbsp; Trash</button></aside><main class="main"><div id="list" class="list" tabindex="0"><table><thead><tr><th class="c-name" data-sort="name">Name <i></i></th><th class="c-date" data-sort="mtime">Date modified <i></i></th><th class="c-type" data-sort="type">Type <i></i></th><th class="c-size" data-sort="size">Size <i></i></th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="state">📂<br>This folder is empty.</div><div id="loading" class="state">Loading…</div></div></main></div>
 <div class="bar status"><span id="count">0 items</span><span id="chosen"></span></div>
</div>
<div id="menu" class="menu"></div><div id="shade" class="shade"></div><div id="toasts" class="toast"></div><div id="drop" class="drop">Drop files to upload</div>
<script>
(()=>{'use strict';
const ROOT='/files/',TRASH='Trash/',MAX=5*1024*1024,HROOT=new Set(['index.html','Trash','.gitkeep','.nginx-client-body','.nginx-client-temp']),HALL=new Set(['.gitkeep','.DS_Store']);
const TXT=new Set('txt md json yaml yml xml csv log conf ini js mjs css html htm py sh bash zsh c cc cpp h hpp java kt go rs toml sql properties gradle dockerfile makefile gitignore env ts tsx jsx vue svelte rb php pl r'.split(' '));
const $=id=>document.getElementById(id),E={body:$('body'),list:$('list'),empty:$('empty'),loading:$('loading'),count:$('count'),chosen:$('chosen'),conn:$('conn'),address:$('address'),search:$('search'),back:$('back'),forward:$('forward'),up:$('up'),home:$('home'),trash:$('trash'),download:$('download'),remove:$('remove'),properties:$('properties'),picker:$('picker'),menu:$('menu'),shade:$('shade'),toasts:$('toasts'),drop:$('drop')};
const S={path:'',entries:[],visible:[],selected:new Set,focus:-1,anchor:-1,sort:'name',dir:1,query:'',history:[''],hi:0,modalClose:null};
function decode(v){try{return decodeURIComponent(v)}catch{return v}}
function norm(path=''){path=String(path).replace(/^#\/?/,'').replace(/^\/+/, '').replace(/^files\//i,'');const a=[];for(const raw of path.split('/')){if(!raw||raw==='.')continue;const p=decode(raw);if(p==='..'||/[\0/\\]/.test(p))throw Error('잘못된 경로입니다.');a.push(p)}return a.length?a.join('/')+'/':''}
function enc(path,slash=String(path).endsWith('/')){const s=norm(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');return s+(s&&slash?'/':'')}
function url(path='',slash=String(path).endsWith('/')){return ROOT+enc(path,slash)}
function name(path){return norm(path).split('/').filter(Boolean).at(-1)||'Home'}
function parent(path){const a=norm(path).split('/').filter(Boolean);a.pop();return a.length?a.join('/')+'/':''}
function valid(n){n=String(n??'').trim();if(!n||n==='.'||n==='..'||/[\0/\\]/.test(n))throw Error('사용할 수 없는 이름입니다.');return n}
function join(base,n,dir=false){return norm(base)+valid(n)+(dir?'/':'')}
function inTrash(path=S.path){path=norm(path);return path===TRASH||path.startsWith(TRASH)}
function ext(n){n=n.toLowerCase();if(['dockerfile','makefile','.gitignore'].includes(n))return n.replace('.','');const i=n.lastIndexOf('.');return i>0?n.slice(i+1):''}
function type(x){return x.dir?'File folder':(ext(x.name)?ext(x.name).toUpperCase()+' File':'File')}
function icon(x){if(x.dir)return'📁';const e=ext(x.name);if(['png','jpg','jpeg','gif','webp','svg'].includes(e))return'🖼️';if(['mp4','mov','mkv','webm'].includes(e))return'🎞️';if(['zip','tar','gz','7z','rar'].includes(e))return'🗜️';return TXT.has(e)?'📄':'📃'}
function bytes(n){n=Number(n);if(!Number.isFinite(n))return'';if(!n)return'0 bytes';const u=['bytes','KB','MB','GB','TB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),4);return(n/1024**i).toLocaleString(undefined,{maximumFractionDigits:i?1:0})+' '+u[i]}
function date(v){const d=new Date(v);return !v||isNaN(d)?'':d.toLocaleString()}
function err(status){return({400:'잘못된 요청입니다.',401:'인증이 필요합니다.',403:'권한이 없습니다.',404:'파일 또는 폴더를 찾을 수 없습니다.',405:'지원하지 않는 작업입니다.',409:'상위 폴더가 없거나 이름이 충돌합니다.',412:'같은 이름의 항목이 있습니다.',413:'파일이 너무 큽니다.',423:'파일이 잠겨 있습니다.',507:'저장 공간이 부족합니다.'})[status]||`요청 실패 (HTTP ${status})`}
async function req(path,opt={},ok=[]){const r=await fetch(path.startsWith('http')?path:url(path,opt.directory??String(path).endsWith('/')),{cache:'no-store',...opt});if(!r.ok&&!ok.includes(r.status))throw Error(err(r.status));return r}
function toast(m){const d=document.createElement('div');d.textContent=m;E.toasts.append(d);setTimeout(()=>d.remove(),4000)}
function loading(v){E.loading.classList.toggle('show',v);if(v)E.empty.classList.remove('show')}
async function load(path,add=true){let p;try{p=norm(path)}catch(e){return toast(e.message)}loading(true);closeMenu();try{const r=await req(p,{directory:true}),j=await r.json();if(!Array.isArray(j))throw Error('autoindex JSON 형식이 아닙니다.');S.path=p;S.entries=j.map(x=>({name:String(x.name||''),dir:String(x.type).toLowerCase()==='directory',size:Number(x.size||0),mtime:x.mtime||''})).filter(x=>x.name&&!HALL.has(x.name)&&!(!p&&HROOT.has(x.name)));S.selected.clear();S.focus=S.anchor=-1;if(add&&S.history[S.hi]!==p){S.history=S.history.slice(0,S.hi+1);S.history.push(p);S.hi++}updateLoc();filter();location.hash=p?'/'+enc(p,true):'/';E.conn.textContent='Connected'}catch(e){E.conn.textContent='Offline';toast(e.message)}finally{loading(false)}}
function updateLoc(){E.address.value=S.path?'Home / '+norm(S.path).split('/').filter(Boolean).join(' / '):'Home';E.search.placeholder='Search '+name(S.path);E.back.disabled=S.hi<=0;E.forward.disabled=S.hi>=S.history.length-1;E.up.disabled=!S.path;E.home.classList.toggle('active',!inTrash());E.trash.classList.toggle('active',inTrash());E.remove.querySelector('span').textContent=inTrash()?'Delete permanently':'Delete'}
function history(d){const n=S.hi+d;if(n<0||n>=S.history.length)return;S.hi=n;load(S.history[n],false)}
function filter(){const q=S.query.toLowerCase(),dir=S.dir;S.visible=S.entries.filter(x=>!q||x.name.toLowerCase().includes(q)).sort((a,b)=>{if(a.dir!==b.dir)return a.dir?-1:1;let r=0;if(S.sort==='name')r=a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});if(S.sort==='mtime')r=new Date(a.mtime||0)-new Date(b.mtime||0);if(S.sort==='type')r=type(a).localeCompare(type(b));if(S.sort==='size')r=a.size-b.size;return r*dir||a.name.localeCompare(b.name,undefined,{numeric:true})});render();document.querySelectorAll('th[data-sort]').forEach(th=>th.querySelector('i').textContent=th.dataset.sort===S.sort?(S.dir===1?'↑':'↓'):'')}
function render(){E.body.replaceChildren();S.visible.forEach((x,i)=>{const tr=document.createElement('tr');tr.className='item'+(S.selected.has(x.name)?' selected':'');tr.dataset.name=x.name;const cells=[document.createElement('td'),document.createElement('td'),document.createElement('td'),document.createElement('td')];const n=document.createElement('div');n.className='name';const ic=document.createElement('span');ic.className='ico';ic.textContent=icon(x);const tx=document.createElement('span');tx.textContent=x.name;n.append(ic,tx);cells[0].append(n);cells[1].textContent=date(x.mtime);cells[2].textContent=type(x);cells[3].textContent=x.dir?'':bytes(x.size);cells[3].className='c-size';tr.append(...cells);tr.onclick=e=>select(i,e);tr.ondblclick=()=>open(x);tr.oncontextmenu=e=>{e.preventDefault();if(!S.selected.has(x.name))only(i);entryMenu(e.clientX,e.clientY,x)};E.body.append(tr)});E.empty.classList.toggle('show',!S.visible.length);selection()}
function only(i){const x=S.visible[i];if(!x)return;S.selected=new Set([x.name]);S.focus=S.anchor=i;paint()}
function select(i,e){const x=S.visible[i];if(!x)return;const add=e.ctrlKey||e.metaKey;if(e.shiftKey&&S.anchor>=0){if(!add)S.selected.clear();let[a,b]=[S.anchor,i].sort((x,y)=>x-y);for(;a<=b;a++)S.selected.add(S.visible[a].name)}else if(add){S.selected.has(x.name)?S.selected.delete(x.name):S.selected.add(x.name);S.anchor=i}else{S.selected=new Set([x.name]);S.anchor=i}S.focus=i;paint()}
function paint(){E.body.querySelectorAll('tr').forEach(r=>r.classList.toggle('selected',S.selected.has(r.dataset.name)));selection()}
function chosen(){return S.visible.filter(x=>S.selected.has(x.name))}
function selection(){const a=chosen(),b=a.filter(x=>!x.dir).reduce((n,x)=>n+x.size,0);E.count.textContent=S.visible.length+' item'+(S.visible.length===1?'':'s');E.chosen.textContent=a.length?`${a.length} selected${b?' · '+bytes(b):''}`:'';E.download.disabled=E.remove.disabled=!a.length;E.properties.disabled=a.length!==1}
function open(x){if(x.dir)return load(join(S.path,x.name,true));if(editable(x))return editFile(x);window.open(url(join(S.path,x.name),false),'_blank','noopener')}
function modal(title,body,buttons=[],editor=false,onClose=null){const m=document.createElement('section');m.className='modal'+(editor?' editor':'');const h=document.createElement('div');h.className='mh';const t=document.createElement('b');t.textContent=title;const c=document.createElement('button');c.className='close';c.textContent='✕';h.append(t,c);const b=document.createElement('div');b.className='mb';b.append(body);const f=document.createElement('div');f.className='mf';m.append(h,b,f);E.shade.replaceChildren(m);E.shade.classList.add('show');const close=async(force=false)=>{if(!force&&onClose&&await onClose()===false)return;E.shade.classList.remove('show');E.shade.replaceChildren();S.modalClose=null};S.modalClose=close;c.onclick=()=>close();buttons.forEach(x=>{const q=document.createElement('button');q.className='btn '+(x.kind||'');q.textContent=x.label;q.onclick=()=>x.action(q,close);f.append(q)});return close}
function promptBox(title,initial){return new Promise(resolve=>{const w=document.createElement('div'),i=document.createElement('input');i.className='input';i.value=initial;w.append(i);let done=false;const finish=v=>{if(done)return;done=true;close(true);resolve(v)};const close=modal(title,w,[{label:'Cancel',action:()=>finish(null)},{label:'OK',kind:'primary',action:()=>finish(i.value)}],false,()=>{finish(null);return true});i.onkeydown=e=>{if(e.key==='Enter')finish(i.value)};setTimeout(()=>{i.focus();i.select()})})}
function confirmBox(title,text,danger=false){return new Promise(resolve=>{const w=document.createElement('div');w.textContent=text;let done=false;const finish=v=>{if(done)return;done=true;close(true);resolve(v)};const close=modal(title,w,[{label:'Cancel',action:()=>finish(false)},{label:danger?'Delete':'OK',kind:danger?'danger':'primary',action:()=>finish(true)}],false,()=>{finish(false);return true})})}
async function newDir(){const r=await promptBox('New folder','New folder');if(r==null)return;try{await req(join(S.path,valid(r),true),{method:'MKCOL',directory:true});toast('폴더를 만들었습니다.');load(S.path,false)}catch(e){toast(e.message)}}
async function exists(path,dir=false){const r=await fetch(url(path,dir),{method:'HEAD',cache:'no-store'});return r.ok}
async function newFile(){const r=await promptBox('New file','New Text Document.txt');if(r==null)return;try{const n=valid(r),p=join(S.path,n);if(await exists(p)&&!await confirmBox('Replace file','같은 이름의 파일이 있습니다. 덮어쓰시겠습니까?'))return;editor({name:n,dir:false,size:0},'',true)}catch(e){toast(e.message)}}
function editable(x){return!x.dir&&x.size<=MAX&&TXT.has(ext(x.name))}
async function editFile(x){try{if(x.size>MAX)throw Error('5MB 이하 텍스트 파일만 편집할 수 있습니다.');const r=await req(join(S.path,x.name),{directory:false}),a=await r.arrayBuffer(),u=new Uint8Array(a.slice(0,4096));if(a.byteLength>MAX||u.includes(0))throw Error('편집할 수 없는 파일입니다.');editor(x,new TextDecoder().decode(a),false)}catch(e){toast(e.message)}}
function editor(x,text,isNew){let original=text,dirty=false,saving=false;const w=document.createElement('div');w.className='editwrap';const info=document.createElement('div');info.className='editinfo';const ta=document.createElement('textarea');ta.value=text;ta.spellcheck=false;const stats=()=>{dirty=ta.value!==original;info.textContent=`/${S.path}${x.name} · ${ta.value.split('\n').length} lines · ${ta.value.length} characters${dirty?' · Modified':''}`};ta.oninput=stats;ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');stats()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}};w.append(info,ta);stats();const save=async()=>{if(saving)return;saving=true;try{await req(join(S.path,x.name),{method:'PUT',directory:false,headers:{'Content-Type':'text/plain; charset=utf-8'},body:ta.value});original=ta.value;dirty=false;toast('파일을 저장했습니다.');close(true);load(S.path,false)}catch(e){toast(e.message)}finally{saving=false}};const close=modal((isNew?'New file — ':'Edit — ')+x.name,w,[{label:'Cancel',action:()=>close()},{label:'Save',kind:'primary',action:save}],true,()=>!dirty||confirm('변경사항을 저장하지 않고 닫으시겠습니까?'));setTimeout(()=>ta.focus())}
async function upload(files){files=[...files];if(!files.length)return;for(const f of files){try{valid(f.name);if(await exists(join(S.path,f.name))&&!await confirmBox('Replace file',`${f.name} 파일을 덮어쓰시겠습니까?`))continue;await new Promise((ok,no)=>{const x=new XMLHttpRequest;x.open('PUT',url(join(S.path,f.name),false));x.onload=()=>x.status<300?ok():no(Error(err(x.status)));x.onerror=()=>no(Error('업로드 네트워크 오류'));x.send(f)});toast(f.name+' 업로드 완료')}catch(e){toast(f.name+': '+e.message)}}load(S.path,false)}
async function ensure(path){let p='';for(const n of norm(path).split('/').filter(Boolean)){p=join(p,n,true);await req(p,{method:'MKCOL',directory:true},[405])}}
function suffix(n,i){const d=n.lastIndexOf('.');return d>0?`${n.slice(0,d)} (${i})${n.slice(d)}`:`${n} (${i})`}
async function unique(p,dir){if(!await exists(p,dir))return p;const par=parent(p),n=name(p);for(let i=1;i<1000;i++){const q=join(par,suffix(n,i),dir);if(!await exists(q,dir))return q}throw Error('고유 이름을 만들 수 없습니다.')}
async function delTree(path,dir){if(!dir)return req(path,{method:'DELETE',directory:false});const j=await(await req(path,{directory:true})).json();for(const x of j){const n=String(x.name||'');if(!n||HALL.has(n))continue;const d=String(x.type).toLowerCase()==='directory';await delTree(join(path,n,d),d)}await req(path,{method:'DELETE',directory:true})}
async function remove(){const a=chosen();if(!a.length)return;const perm=inTrash();if(!await confirmBox(perm?'Delete permanently':'Move to Trash',perm?'선택한 항목을 영구 삭제하시겠습니까? 되돌릴 수 없습니다.':'선택한 항목을 Trash로 이동하시겠습니까?',perm))return;try{for(const x of a){const src=join(S.path,x.name,x.dir);if(perm)await delTree(src,x.dir);else{const par=TRASH+S.path;await ensure(par);let dst=await unique(join(par,x.name,x.dir),x.dir);await req(src,{method:'MOVE',directory:x.dir,headers:{Destination:new URL(url(dst,x.dir),location.origin).href,Overwrite:'F'}})}}toast(perm?'영구 삭제했습니다.':'Trash로 이동했습니다.');load(S.path,false)}catch(e){toast(e.message)}}
async function props(x){const p=join(S.path,x.name,x.dir);let h;try{h=(await req(p,{method:'HEAD',directory:x.dir})).headers}catch{}const rows=[['Name',x.name],['Type',type(x)],['Path','/'+p],['Size',x.dir?'Not calculated':bytes(Number(h?.get('content-length')||x.size))],['Modified',date(h?.get('last-modified')||x.mtime)],['MIME type',h?.get('content-type')||(x.dir?'directory':'unknown')],['URL',new URL(url(p,x.dir),location.origin).href]],w=document.createElement('div');w.className='props';for(const [a,b] of rows){const l=document.createElement('b'),v=document.createElement('span');l.textContent=a;v.textContent=b||'—';w.append(l,v)}const close=modal('Properties',w,[{label:'OK',kind:'primary',action:()=>close(true)}])}
function fileDownload(x){const a=document.createElement('a');a.href=url(join(S.path,x.name),false);a.download=x.name;document.body.append(a);a.click();a.remove()}
async function collect(path,prefix,out){const j=await(await req(path,{directory:true})).json();for(const x of j){const n=String(x.name||'');if(!n||HALL.has(n))continue;const d=String(x.type).toLowerCase()==='directory',p=join(path,n,d);d?await collect(p,prefix+n+'/',out):out.push({path:p,name:prefix+n})}}
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc(a){let c=0xffffffff;for(const b of a)c=CT[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function zip(items){const en=new TextEncoder,local=[],central=[];let off=0;for(const it of items){const n=en.encode(it.name),d=it.data,c=crc(d),l=new Uint8Array(30+n.length),v=new DataView(l.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,c,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,n.length,true);l.set(n,30);local.push(l,d);const q=new Uint8Array(46+n.length),w=new DataView(q.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint32(16,c,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,n.length,true);w.setUint32(42,off,true);q.set(n,46);central.push(q);off+=l.length+d.length}const size=central.reduce((s,x)=>s+x.length,0),e=new Uint8Array(22),v=new DataView(e.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,items.length,true);v.setUint16(10,items.length,true);v.setUint32(12,size,true);v.setUint32(16,off,true);return new Blob([...local,...central,e],{type:'application/zip'})}
async function download(){const a=chosen();if(!a.length)return;if(a.length===1&&!a[0].dir)return fileDownload(a[0]);try{const files=[];for(const x of a){const p=join(S.path,x.name,x.dir);x.dir?await collect(p,x.name+'/',files):files.push({path:p,name:x.name})}const z=[];for(const f of files)z.push({name:f.name,data:new Uint8Array(await(await req(f.path,{directory:false})).arrayBuffer())});const blob=zip(z),u=URL.createObjectURL(blob),q=document.createElement('a');q.href=u;q.download=(a.length===1?a[0].name:name(S.path)+'-selection')+'.zip';q.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){toast(e.message)}}
function closeMenu(){E.menu.classList.remove('show');E.menu.replaceChildren()}
function showMenu(x,y,items){closeMenu();for(const it of items){if(it==='-'){E.menu.append(document.createElement('hr'));continue}const b=document.createElement('button');b.textContent=it.label;b.className=it.danger?'danger':'';b.onclick=()=>{closeMenu();it.run()};E.menu.append(b)}E.menu.classList.add('show');const r=E.menu.getBoundingClientRect();E.menu.style.left=Math.min(x,innerWidth-r.width-8)+'px';E.menu.style.top=Math.min(y,innerHeight-r.height-8)+'px'}
function entryMenu(x,y,e){const a=[{label:'Open',run:()=>open(e)}];if(editable(e))a.push({label:'Edit',run:()=>editFile(e)});a.push({label:e.dir?'Download as ZIP':'Download',run:download},'-',{label:'Properties',run:()=>props(e)},{label:inTrash()?'Delete permanently':'Delete',danger:inTrash(),run:remove});showMenu(x,y,a)}
function bgMenu(x,y){S.selected.clear();paint();showMenu(x,y,[{label:'New folder',run:newDir},{label:'New file',run:newFile},{label:'Upload',run:()=>E.picker.click()},'-',{label:'Refresh',run:()=>load(S.path,false)}])}
document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=1}filter()});
$('newDir').onclick=newDir;$('newFile').onclick=newFile;$('upload').onclick=()=>E.picker.click();E.download.onclick=download;E.remove.onclick=remove;E.properties.onclick=()=>{const[x]=chosen();if(x)props(x)};$('refresh').onclick=()=>load(S.path,false);E.picker.onchange=()=>{upload(E.picker.files);E.picker.value=''};E.back.onclick=()=>history(-1);E.forward.onclick=()=>history(1);E.up.onclick=()=>S.path&&load(parent(S.path));E.home.onclick=()=>load('');E.trash.onclick=async()=>{try{await ensure(TRASH);load(TRASH)}catch(e){toast(e.message)}};E.search.oninput=()=>{S.query=E.search.value;filter()};E.address.onfocus=()=>{E.address.value=S.path?'/'+S.path:'/';E.address.select()};E.address.onblur=updateLoc;E.address.onkeydown=e=>{if(e.key==='Enter'){load(E.address.value);E.address.blur()}if(e.key==='Escape'){updateLoc();E.address.blur()}};E.list.onclick=e=>{if(!e.target.closest('tr.item')){S.selected.clear();paint()}};E.list.oncontextmenu=e=>{if(!e.target.closest('tr.item')){e.preventDefault();bgMenu(e.clientX,e.clientY)}};document.onclick=e=>{if(!e.target.closest('#menu'))closeMenu()};document.addEventListener('scroll',closeMenu,true);addEventListener('resize',closeMenu);
document.onkeydown=e=>{if(e.target.matches('input,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();S.selected=new Set(S.visible.map(x=>x.name));paint()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();E.search.focus()}if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();only(Math.min(S.visible.length-1,Math.max(0,S.focus+1)))}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();only(Math.max(0,S.focus<0?0:S.focus-1))}if(e.key==='Enter'){const[x]=chosen();if(chosen().length===1)open(x)}if(e.key==='Backspace'){e.preventDefault();if(S.path)load(parent(S.path))}if(e.key==='Delete'&&chosen().length){e.preventDefault();remove()}if(e.key==='Escape'){closeMenu();if(S.modalClose)S.modalClose();else{S.selected.clear();paint()}}};
let depth=0;document.ondragenter=e=>{e.preventDefault();depth++;E.drop.classList.add('show')};document.ondragover=e=>e.preventDefault();document.ondragleave=e=>{e.preventDefault();if(--depth<=0){depth=0;E.drop.classList.remove('show')}};document.ondrop=e=>{e.preventDefault();depth=0;E.drop.classList.remove('show');upload(e.dataTransfer.files)};addEventListener('hashchange',()=>{const p=decode(location.hash.replace(/^#\/?/,''));try{if(norm(p)!==S.path)load(p)}catch(e){toast(e.message)}});load(decode(location.hash.replace(/^#\/?/,'')),false);
})();
