<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FileServer 비밀번호 변경</title>
  <link rel="stylesheet" href="/auth-assets/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="brand"><span>📁</span><span>FileServer</span></div>
    <section class="card">
      <h1>비밀번호 변경</h1>
      <p id="description" class="sub">현재 비밀번호를 확인한 뒤 새 비밀번호를 설정합니다.</p>
      <form id="form">
        <div class="field"><label for="current">현재 비밀번호</label><input id="current" type="password" autocomplete="current-password" required maxlength="128"></div>
        <div class="field"><label for="next">새 비밀번호</label><input id="next" type="password" autocomplete="new-password" required maxlength="128"></div>
        <div class="field"><label for="confirm">새 비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" required maxlength="128"></div>
        <button id="submit" class="button" type="submit">비밀번호 변경</button>
      </form>
      <div id="message" class="message" role="alert"></div>
      <div class="links"><a id="back" href="/">FileServer로 돌아가기</a></div>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const message = document.getElementById('message');
  const description = document.getElementById('description');
  let csrfToken = '';
  let passwordMinLength = 8;

  function show(text, kind = 'error') {
    message.textContent = text;
    message.className = `message show ${kind}`;
  }

  async function json(response) {
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || `요청 실패 (HTTP ${response.status})`);
    return body;
  }

  async function initialize() {
    try {
      const config = await json(await fetch('/api/auth/config', { cache: 'no-store' }));
      if (config.mode === 'public') return location.replace('/');
      passwordMinLength = Number(config.password_min_length || 8);
      document.getElementById('next').minLength = passwordMinLength;
      document.getElementById('confirm').minLength = passwordMinLength;

      const response = await fetch('/api/auth/me', { cache: 'no-store' });
      if (response.status === 401) return location.replace('/login?next=/change-password');
      const me = await json(response);
      csrfToken = me.csrf_token;
      if (me.user?.must_change_password) {
        description.textContent = '초기 관리자 비밀번호를 변경해야 FileServer와 관리자 기능을 사용할 수 있습니다.';
        document.getElementById('back').hidden = true;
        show('보안을 위해 초기 비밀번호를 반드시 변경하세요.', 'info');
      }
    } catch (error) {
      show(error.message);
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const currentPassword = document.getElementById('current').value;
    const newPassword = document.getElementById('next').value;
    const confirm = document.getElementById('confirm').value;
    if (newPassword.length < passwordMinLength) return show(`새 비밀번호는 ${passwordMinLength}자 이상이어야 합니다.`);
    if (newPassword !== confirm) return show('새 비밀번호 확인이 일치하지 않습니다.');

    submit.disabled = true;
    try {
      const data = await json(await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
      }));
      show(data.message, 'success');
      setTimeout(() => location.replace('/'), 600);
    } catch (error) {
      show(error.message);
    } finally {
      submit.disabled = false;
    }
  });

  initialize();
})();
</script>
</body>
</html>
