<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FileServer 사용자 등록</title>
  <link rel="stylesheet" href="/auth-assets/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="brand"><span>📁</span><span>FileServer</span></div>
    <section class="card">
      <h1>사용자 등록</h1>
      <p class="sub">계정을 등록하면 관리자가 승인 또는 거절합니다. 승인 후 등록한 ID와 비밀번호로 로그인할 수 있습니다.</p>
      <form id="form">
        <div class="field"><label for="username">사용자 ID</label><input id="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+"></div>
        <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="new-password" required maxlength="128"></div>
        <div class="field"><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" required maxlength="128"></div>
        <button id="submit" class="button" type="submit">권한 승인 요청</button>
      </form>
      <div id="message" class="message" role="alert"></div>
      <div class="links"><a href="/login">로그인으로 돌아가기</a></div>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const message = document.getElementById('message');
  let passwordMinLength = 8;

  function show(text, kind = 'error') {
    message.textContent = text;
    message.className = `message show ${kind}`;
  }

  async function json(response) {
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || `요청 실패 (HTTP ${response.status})`);
    return body;
  }

  async function initialize() {
    try {
      const config = await json(await fetch('/api/auth/config', { cache: 'no-store' }));
      if (config.mode === 'public') return location.replace('/');
      passwordMinLength = Number(config.password_min_length || 8);
      document.getElementById('password').minLength = passwordMinLength;
      document.getElementById('confirm').minLength = passwordMinLength;
    } catch (error) {
      show(error.message);
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password.length < passwordMinLength) return show(`비밀번호는 ${passwordMinLength}자 이상이어야 합니다.`);
    if (password !== confirm) return show('비밀번호 확인이 일치하지 않습니다.');

    submit.disabled = true;
    try {
      const data = await json(await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('username').value, password })
      }));
      form.reset();
      show(data.message, 'success');
    } catch (error) {
      show(error.message);
    } finally {
      submit.disabled = false;
    }
  });

  initialize();
})();
</script>
</body>
</html>
