name: Build FileExplore Android

on:
  push:
    paths:
      - "FileServerAndroid/**"
      - ".github/workflows/fileserver-android.yml"
  pull_request:
    paths:
      - "FileServerAndroid/**"
      - ".github/workflows/fileserver-android.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FileServerAndroid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileExplore-debug-apk
          path: FileServerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
