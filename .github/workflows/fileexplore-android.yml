name: FileExplore Android

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"
    paths:
      - "FileExploreAndroid/**"
      - ".github/workflows/fileexplore-android.yml"
  pull_request:
    paths:
      - "FileExploreAndroid/**"
      - ".github/workflows/fileexplore-android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build
        working-directory: FileExploreAndroid
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --console=plain > build.log 2>&1
          status=$?
          echo "$status" > build-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileExplore-build-diagnostics
          path: |
            FileExploreAndroid/build-status.txt
            FileExploreAndroid/build.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FileExplore-debug-apk
          path: FileExploreAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail when Gradle build fails
        if: steps.build.outputs.status != '0'
        run: exit 1
