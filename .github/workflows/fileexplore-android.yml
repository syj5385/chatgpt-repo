name: FileExplore Android

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/**"
    paths:
      - "FileExploreAndroid/**"
      - ".github/workflows/fileexplore-android.yml"
  pull_request:
    paths:
      - "FileExploreAndroid/**"
      - ".github/workflows/fileexplore-android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: FileExploreAndroid
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure tail"
            tail -n 180 build.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FileExplore-debug-apk
          path: FileExploreAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
